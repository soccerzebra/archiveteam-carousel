name: publish-images

# Build and publish the multi-arch (linux/amd64 + linux/arm64) image to GitHub Container Registry.
#   * push to master      -> ghcr.io/<owner>/archiveteam-carousel:edge   (bleeding edge)
#   * version tag (v1.2.3) -> :latest, :1.2.3, :1.2              (stable releases)
#   * workflow_dispatch    -> on demand
# Nothing is pushed unless the CI checks (format, lint, types, tests) pass on that commit.
# Consumers then just: `docker compose up -d` (pulls :latest; Docker picks their architecture).
#
# Each architecture builds natively on its own runner (wget-at and NSS compile from source, which
# is far too slow under emulation) and is pushed by digest; `merge` then publishes one tag list
# pointing at both.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One publish per ref at a time, never cancelled mid-push; if several pushes queue up, only
# the newest waits, so an older commit can't overwrite a newer :edge.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase image name for GHCR
        id: ns
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/archiveteam-carousel" >> "$GITHUB_OUTPUT"

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ns.outputs.image }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.platform }} by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.ns.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Lowercase image name for GHCR
        id: ns
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/archiveteam-carousel" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ns.outputs.image }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.ns.outputs.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.ns.outputs.image }}:${{ steps.meta.outputs.version }}"
