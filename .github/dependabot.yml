version: 2
updates:
  # Python dependencies. Dependabot reads pyproject.toml and keeps the pip-tools
  # locks (requirements*.txt) in sync when it opens an update PR.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dev:
        dependency-type: development

  # The Debian base image digests pinned in docker/Dockerfile. (wget-at itself is pinned by
  # commit; catalog-compat.yml flags when it needs a bump.)
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # The GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
