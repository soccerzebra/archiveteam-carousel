[project]
name = "carousel"
version = "0.0.1"
description = "Docker-native ArchiveTeam Warrior that runs multiple projects simultaneously"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-tools>=7.4",
]

[project.scripts]
carousel = "controlplane.app:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["controlplane", "worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored / study code is held to its own (upstream) standards, not ours.
# tests/fixtures/*/pipeline.py are sample ArchiveTeam projects that mirror upstream
# quirks (exec-time magic globals, %-format, assert False) — treated like vendored code.
extend-exclude = ["reference", "data", "*.egg-info", "tests/fixtures"]

[tool.ruff.lint]
# Pragmatic set: pyflakes/pycodestyle errors + import sorting (I, replaces isort),
# likely bugs (B), py3.11 modernization (UP), simplifications (SIM, C4), ruff-native (RUF).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
# UP042: `class X(str, Enum)` is deliberate here (stable JSON/pydantic serialization);
# StrEnum would change `str(member)` and risk wire-protocol compatibility.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests import after a sys.path insert (E402) and use `assert False, "..."` as a
# "should have raised" sentinel (B011) — both normal in test code, never run under -O.
"tests/**" = ["E402", "B011"]

[tool.mypy]
python_version = "3.11"
# First-party only; vendored terroroftinytown (data/) and reference/ are Py2-era.
files = ["controlplane", "worker"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# Non-strict to start. Tighten per-module with [[tool.mypy.overrides]] as code is annotated.

[tool.coverage.run]
source = ["controlplane", "worker"]
branch = true
# worker/seesaw is the project-facing surface exercised via subprocess, not unit tests.
omit = ["worker/seesaw/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Only our suite; reference/ is gitignored upstream study code (Py2-era, needs Tornado 4).
testpaths = ["tests"]
norecursedirs = ["reference", ".venv", "*.egg-info"]
